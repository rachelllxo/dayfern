<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#244e38"><title>Dayfern · Digital wellbeing</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/styles.css"><script src="/app.js" defer></script></head><body>
<aside><div class="brand"><img src="/favicon.svg" alt="">Dayfern</div><a href="/" style="margin:16px 10px;color:#285b40">Study planner</a><div class="navlabel">WORKSPACE</div><nav aria-label="Workspace"><button data-page="Overview"><i data-icon="grid"></i>Overview</button><button data-page="Patterns"><i data-icon="spark"></i>Patterns</button><button data-page="Journal"><i data-icon="book"></i>Check-in journal</button></nav><div class="sidefoot"><i data-icon="leaf"></i><span>Dayfern workspace<small>Digital wellbeing journal</small></span></div></aside>
<main><header><span>Workspace <b>/</b> <strong id="crumb">Overview</strong></span><button id="switch" class="quiet"></button></header>
<div class="heading"><div><div class="eyebrow" id="stamp"></div><h1 id="title"></h1></div><button class="primary" id="add"><span>＋</span> Add check-in</button></div>
<div id="message" role="status"></div><div id="view"></div>
</main>
<dialog id="entry"><form id="form"><div class="dialoghead"><h2 id="formtitle">Daily check-in</h2><button type="button" class="close" aria-label="Close">×</button></div><p>Copy the totals from your device’s usage report.</p><label>Date<input type="date" name="date" required></label><div class="fields"><label>Screen time (minutes)<input type="number" name="screen" min="0" max="1440" required></label><label>Focus time (minutes)<input type="number" name="focus" min="0" max="1440" required></label></div><div class="fields"><label>Phone pickups<input type="number" name="pickups" min="0" max="2500" required></label><label>Mood<select name="mood"><option value="1">1 · Low</option><option value="2">2 · A little low</option><option value="3" selected>3 · Steady</option><option value="4">4 · Good</option><option value="5">5 · Great</option></select></label></div><p class="error" id="formerror" role="alert"></p><button class="primary" type="submit">Save check-in</button></form></dialog>
</body></html>
