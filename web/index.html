<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dayfern · Study planner</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/planner.css"><script type="module" src="/planner.js"></script></head><body>
<header><a class="brand" href="/"><img src="/favicon.svg" alt="">Dayfern</a><nav aria-label="Workspace"><button data-view="today">Today</button><button data-view="tasks">Tasks</button><button data-view="review">Weekly review</button><a href="/wellbeing">Wellbeing journal</a></nav></header>
<main><div class="top"><div><small id="mode"></small><h1 id="title">Today’s plan</h1></div><div class="actions"><button id="demo"></button><button id="new" class="primary">＋ Add task</button></div></div>
<p id="status" role="status"></p><section class="timer" aria-label="Focus timer"><div><small>FOCUS TIMER</small><h2 id="active">Ready to study</h2></div><div class="actions"><b id="clock">00:00</b><button id="pause" hidden>Pause</button><button id="finish" hidden>Finish task</button></div></section>
<div id="content" aria-live="polite"></div><footer>Planner records stay in this browser profile. Export a backup from Weekly review.</footer></main>
<dialog id="editor"><form id="taskform"><h2 id="dialogtitle">Add task</h2><label>Task name<input name="title" maxlength="120" required></label><div class="pair"><label>Subject<input name="subject" maxlength="64" required></label><label>Task type<select name="kind"></select></label></div><div class="pair"><label>Original estimate (min)<input name="estimate" type="number" min="1" max="1440" value="30" required></label><label>Deadline<input name="due" type="date" required></label></div><label>Priority<select name="priority"><option value="1">Low</option><option value="2" selected>Normal</option><option value="3">High</option></select></label><label id="remainingLabel" hidden>Revised time left (min, optional)<input name="timeLeft" type="number" min="1" max="1440" placeholder="Use the model forecast"></label><fieldset><legend>Reserve a session (optional)</legend><div class="pair"><label>Date<input name="pinDate" type="date"></label><label>Start time<input name="pinTime" type="time"></label></div></fieldset><p id="formerror" role="alert"></p><div class="actions"><button type="button" id="cancel">Cancel</button><button class="primary">Save task</button></div></form></dialog>
<input id="upload" type="file" accept=".json,application/json" hidden></body></html>
